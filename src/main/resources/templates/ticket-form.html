<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="app-shell compact-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">IT</div>
            <div>
                <h1>IT-Ticketing-System</h1>
            </div>
        </div>
        <nav class="nav">
            <a class="nav-item" th:href="@{/}" th:classappend="${currentPage == 'dashboard' || currentPage == 'ticket' ? 'active' : ''}">Dashboard</a>
            <a class="nav-item" th:href="@{/tickets/overdue}" th:classappend="${currentPage == 'overdue' ? 'active' : ''}">Overdue</a>
            <a class="nav-item" th:href="@{/reports}" th:classappend="${currentPage == 'reports' ? 'active' : ''}">Reports</a>
            <a class="nav-item" th:href="@{/tickets/new}" th:classappend="${currentPage == 'new' ? 'active' : ''}">New Ticket</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <p class="eyebrow">Support</p>
                <h2>Create new ticket</h2>
            </div>
        </header>

        <section class="panel form-panel">
            <form th:action="@{/tickets/new}" th:object="${ticket}" method="post" class="ticket-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="validation-summary" th:if="${#fields.hasAnyErrors()}" role="alert">
                    <strong>Review the highlighted fields</strong>
                    <span th:each="error : ${#fields.errors('*')}" th:text="${error}">Please check this field.</span>
                </div>
                <div class="field-group">
                    <label for="title">Title</label>
                            <input id="title" type="text" th:field="*{title}" maxlength="150" autocomplete="off" required>
                    <small class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Enter a valid title.</small>
                </div>

                <div class="field-group">
                    <label for="priority">Priority</label>
                    <select id="priority" th:field="*{priority}">
                        <option th:each="priority : ${T(com.lorcandelong.it_ticketing_system.model.TicketPriority).values()}"
                                th:value="${priority}"
                                th:text="${priority}">
                        </option>
                    </select>
                    <small class="field-error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}">Choose a priority.</small>
                </div>

                <div class="field-group">
                    <label for="assignee">Assignee</label>
                    <input id="assignee" type="text" th:field="*{assignee}" maxlength="100" placeholder="alice@example.com" autocomplete="off">
                </div>

                <div class="field-group">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" rows="8" maxlength="5000" required></textarea>
                    <small class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Enter a description.</small>
                </div>

                <div class="form-actions">
                    <a class="secondary-btn" th:href="@{/}">Cancel</a>
                    <button class="primary-btn" type="submit">Create Ticket</button>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
